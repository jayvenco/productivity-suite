services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Optioneel, voor voice-notities (zie README -> Configuratie): wijst naar een losse,
    # zelf-gehoste Speaches-container (voorheen faster-whisper-server). Zonder deze
    # variabelen werkt de rest van de app gewoon door.
    # environment:
    #   WHISPER_SERVICE_URL: "http://192.168.1.50:8000"
    #   WHISPER_MODEL: "Systran/faster-whisper-base"
