{% extends "base.html" %}
{% block title %}Inloggen - Productivity Suite{% endblock %}
{% block content_anon %}
<div class="login-page">
  <div class="login-box">
    <img src="{{ static_url('images/logo.png') }}" alt="Productivity Suite" class="login-logo" width="220" height="220">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="username">Gebruikersnaam</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Wachtwoord</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn" style="width:100%">Inloggen</button>
    </form>
  </div>
</div>
{% endblock %}
