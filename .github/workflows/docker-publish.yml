name: Docker image publiceren

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Eén gewoon image-manifest (geen attestatie-index): dat is wat Unraid vergelijkt om te
          # zien of er een update is.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/jayvenco/productivity-suite:latest
            ghcr.io/jayvenco/productivity-suite:${{ github.sha }}
